name: Shared AWS CDK deployment

on:
  workflow_call:
    inputs:
      allowed-dispatch-actor:
        description: GitHub actor allowed to deploy through a workflow_dispatch caller.
        required: false
        type: string
        default: cyaris
      aws-region:
        description: AWS region containing the stack.
        required: true
        type: string
      deploy-on-changes-to:
        description: >-
          Optional path. When set, deploy only if it differs from the commit of the calling workflow's newest successful
          run on this branch and event. Empty always deploys.
        required: false
        type: string
        default: ""
      aws-role-to-assume:
        description: Optional AWS role ARN for OIDC authentication. If omitted, AWS access key secrets are used.
        required: false
        type: string
        default: ""
      node-version:
        description: Node.js version used for the CDK package.
        required: false
        type: string
        default: "24"
      run-synth:
        description: Run npm run synth before deployment.
        required: false
        type: boolean
        default: true
      run-test:
        description: Run npm test before deployment.
        required: false
        type: boolean
        default: true
      stack-name:
        description: CloudFormation stack name to deploy.
        required: true
        type: string
      working-directory:
        description: Directory containing the AWS CDK package and cdk.json.
        required: false
        type: string
        default: infra
    secrets:
      AWS_ACCESS_KEY_ID:
        description: AWS access key used when aws-role-to-assume is omitted.
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: AWS secret key used when aws-role-to-assume is omitted.
        required: false
      AWS_SESSION_TOKEN:
        description: Optional AWS session token used when aws-role-to-assume is omitted.
        required: false

    outputs:
      deployed:
        description: Whether this run deployed the stack.
        value: ${{ jobs.detect-changes.outputs.deploy }}

permissions:
  contents: read

jobs:
  detect-changes:
    # Reading the calling workflow's runs needs `actions: read`, which every caller grants for that reason.
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}

    steps:
      - name: Checkout caller repository
        if: inputs.deploy-on-changes-to != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        name: Detect infrastructure changes
        env:
          CHANGED_PATH: ${{ inputs.deploy-on-changes-to }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail

          # Compare with the newest successful run of the calling workflow rather than the triggering push's own
          # range. A newer push replaces a still-pending run in a concurrency group, and a failed run leaves its stack
          # undeployed, so either would hide a change from every later run. A caller's run succeeds only when this
          # deployment succeeded or found nothing to deploy, so its commit marks deployed infrastructure. Runs of
          # other events are not counted, since a caller may skip deployment for them.
          deploy="true"
          if [[ -n "$CHANGED_PATH" ]]; then
            workflow_file="${WORKFLOW_REF%@*}"
            workflow_file="${workflow_file##*/}"
            deployed_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow_file" --branch "$REF_NAME" \
              --event "$GITHUB_EVENT_NAME" --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
            if [[ -n "$deployed_sha" ]] && git cat-file -e "$deployed_sha^{commit}" 2>/dev/null \
              && git diff --quiet "$deployed_sha" "$GITHUB_SHA" -- "$CHANGED_PATH"; then
              deploy="false"
              printf "%s is unchanged since %s, the newest successful %s run.\n" "$CHANGED_PATH" "$deployed_sha" "$workflow_file"
            fi
          fi

          printf "deploy=%s\n" "$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy == 'true'
    # The OIDC path needs an ID token, and a called workflow can only keep permissions its caller grants, so every
    # caller grants this job `id-token: write` even when it deploys with access keys.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment request
        env:
          ALLOWED_DISPATCH_ACTOR: ${{ inputs.allowed-dispatch-actor }}
          AWS_ACCESS_KEY_ID_INPUT: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ROLE_TO_ASSUME: ${{ inputs.aws-role-to-assume }}
          AWS_SECRET_ACCESS_KEY_INPUT: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          STACK_NAME: ${{ inputs.stack-name }}
        run: |
          set -euo pipefail

          # A re-run keeps the original actor while the person who started it is the triggering actor.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && ( "$GITHUB_ACTOR" != "$ALLOWED_DISPATCH_ACTOR" || "$GITHUB_TRIGGERING_ACTOR" != "$ALLOWED_DISPATCH_ACTOR" ) ]]; then
            printf "Manual dispatch is restricted to %s.\n" "$ALLOWED_DISPATCH_ACTOR" >&2
            exit 1
          fi

          if [[ ! "$STACK_NAME" =~ ^[A-Za-z][A-Za-z0-9-]*$ ]]; then
            printf "Invalid CloudFormation stack name: %s\n" "$STACK_NAME" >&2
            exit 1
          fi

          if [[ -z "$AWS_ROLE_TO_ASSUME" && ( -z "$AWS_ACCESS_KEY_ID_INPUT" || -z "$AWS_SECRET_ACCESS_KEY_INPUT" ) ]]; then
            printf "AWS CDK deployment requires aws-role-to-assume or AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.\n" >&2
            exit 1
          fi

      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install infrastructure dependencies
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Synthesize infrastructure
        if: inputs.run-synth
        working-directory: ${{ inputs.working-directory }}
        run: npm run synth

      - name: Test infrastructure
        if: inputs.run-test
        working-directory: ${{ inputs.working-directory }}
        run: npm test

      - name: Configure AWS credentials with OIDC
        if: inputs.aws-role-to-assume != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-session-name: cdk-deploy-${{ github.run_id }}
          role-to-assume: ${{ inputs.aws-role-to-assume }}

      - name: Configure AWS credentials with access keys
        if: inputs.aws-role-to-assume == ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ inputs.aws-region }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Deploy infrastructure
        env:
          STACK_NAME: ${{ inputs.stack-name }}
        working-directory: ${{ inputs.working-directory }}
        run: npx cdk deploy "$STACK_NAME" --require-approval never
