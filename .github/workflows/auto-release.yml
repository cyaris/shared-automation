name: Shared auto release

on:
  workflow_call:
    inputs:
      release-sha:
        description: Commit SHA to reconcile releases through. Blank uses the default branch tip.
        required: false
        type: string
        default: ""
      pr-number:
        description: Optional pull request number to comment on.
        required: false
        type: string
        default: ""
      policy-path:
        description: Local release policy path in the caller repository.
        required: false
        type: string
        default: .github/release-policy.yml
      openai-model:
        description: OpenAI model used to reconcile release milestones and notes.
        required: false
        type: string
        default: gpt-5-mini
      default-branch:
        description: Default branch name. Leave blank to use the repository default branch.
        required: false
        type: string
        default: ""
      dry-run:
        description: Decide and report release changes without applying them.
        required: false
        type: boolean
        default: false
      publish:
        description: Apply selected release creates and updates. Keep false to report the plan only.
        required: false
        type: boolean
        default: false
      update-existing:
        description: Allow updates to existing release titles and notes.
        required: false
        type: boolean
        default: true
      review-artifact-retention-days:
        description: Days to retain report-only review artifacts.
        required: false
        type: number
        default: 30
      shared-automation-repository:
        description: Repository containing the shared release policy.
        required: false
        type: string
        default: ""
      shared-automation-ref:
        description: Ref used to read the shared release policy.
        required: false
        type: string
        default: ""
      allowed-dispatch-actor:
        description: GitHub actor allowed to run this workflow from workflow_dispatch callers.
        required: false
        type: string
        default: cyaris
    secrets:
      OPENAI_API_KEY:
        description: OpenAI API key used for automated release decisions.
        required: true
      RELEASE_TOKEN:
        description: Optional token with permission to create releases and tags.
        required: false
      CHECKOUT_TOKEN:
        description: Optional token with read access to the shared automation repository.
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: auto-release-${{ github.repository }}-${{ inputs.release-sha || github.sha }}
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

    steps:
      - name: Validate manual dispatcher
        if: ${{ github.event_name == 'workflow_dispatch' && github.actor != inputs['allowed-dispatch-actor'] }}
        env:
          ALLOWED_DISPATCH_ACTOR: ${{ inputs['allowed-dispatch-actor'] }}
        run: |
          set -euo pipefail

          printf "Manual dispatch is restricted to %s.\n" "$ALLOWED_DISPATCH_ACTOR" >&2
          exit 1

      - name: Check release decision credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$OPENAI_API_KEY" ]]; then
            printf "OPENAI_API_KEY is required for release reconciliation.\n" >&2
            exit 1
          fi

      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: caller
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Checkout shared release policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.shared-automation-repository || 'cyaris/shared-automation' }}
          ref: ${{ inputs.shared-automation-ref || 'main' }}
          path: shared-automation
          persist-credentials: false
          token: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Gather release context
        id: context
        working-directory: caller
        env:
          DEFAULT_BRANCH_INPUT: ${{ inputs.default-branch }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FETCH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          POLICY_PATH: ${{ inputs.policy-path }}
          RELEASE_SHA_INPUT: ${{ inputs.release-sha }}
          UPDATE_EXISTING: ${{ inputs.update-existing }}
        run: |
          set -euo pipefail

          git_fetch_origin() {
            local auth_header
            auth_header="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" fetch "$@"
          }

          default_branch="${DEFAULT_BRANCH_INPUT:-$EVENT_DEFAULT_BRANCH}"
          if ! git_fetch_origin --force --tags origin; then
            printf "Failed to fetch tags from %s.\n" "$GITHUB_REPOSITORY" >&2
            exit 1
          fi

          if [[ -n "$default_branch" ]]; then
            if ! git_fetch_origin --force origin "$default_branch:refs/remotes/origin/$default_branch"; then
              printf "Failed to fetch default branch %s from %s.\n" "$default_branch" "$GITHUB_REPOSITORY" >&2
              exit 1
            fi
          fi

          release_sha="$RELEASE_SHA_INPUT"
          if [[ -z "$release_sha" ]]; then
            if [[ -n "$default_branch" ]]; then
              release_sha="$(git rev-parse "origin/$default_branch")"
            else
              release_sha="$(git rev-parse HEAD)"
            fi
          fi

          if ! git cat-file -e "${release_sha}^{commit}"; then
            if ! git_fetch_origin --force origin "$release_sha"; then
              printf "Failed to fetch release_sha %s from %s.\n" "$release_sha" "$GITHUB_REPOSITORY" >&2
              exit 1
            fi
          fi

          if [[ -n "$default_branch" ]]; then
            if ! git merge-base --is-ancestor "$release_sha" "origin/$default_branch"; then
              printf "release_sha %s is not an ancestor of origin/%s.\n" "$release_sha" "$default_branch" >&2
              exit 1
            fi
          fi

          git log --reverse --date=short --format="%H%x09%h%x09%ad%x09%s" "$release_sha" -- > ../commits.tsv
          git ls-tree -r --name-only "$release_sha" > ../files.txt
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp > ../existing-releases.raw.json

          export DEFAULT_BRANCH="$default_branch"
          export RELEASE_SHA="$release_sha"

          node <<'NODE'
          const cp = require("child_process")
          const fs = require("fs")

          const read = (path, max) => {
            try {
              const text = fs.readFileSync(path, "utf8")
              return typeof max === "number" ? text.slice(0, max) : text
            } catch {
              return ""
            }
          }

          const git = (args) =>
            cp.execFileSync("git", args, { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }).trim()

          const maxCommits = 1000
          const maxFiles = 1000
          const commitLines = read("../commits.tsv")
            .split("\n")
            .filter(Boolean)

          const allCommits = commitLines.map((line, index) => {
            const [sha, shortSha, date, ...subjectParts] = line.split("\t")
            return {
              index: index + 1,
              sha,
              shortSha,
              date,
              subject: subjectParts.join("\t")
            }
          })
          const commitIndexBySha = new Map(allCommits.map((commit, index) => [commit.sha, index]))

          const releasePages = JSON.parse(read("../existing-releases.raw.json") || "[]")
          const rawReleases = releasePages.flat()
          const existingReleases = rawReleases
            .filter((release) => !release.draft)
            .map((release) => {
              let targetSha = ""
              try {
                targetSha = git(["rev-list", "-n", "1", `refs/tags/${release.tag_name}^{}`])
              } catch {
                try {
                  targetSha = git(["rev-parse", `${release.target_commitish}^{commit}`])
                } catch {
                  targetSha = ""
                }
              }

              return {
                tag: release.tag_name || "",
                title: release.name || "",
                notes: release.body || "",
                publishedAt: release.published_at || "",
                prerelease: Boolean(release.prerelease),
                targetCommitish: release.target_commitish || "",
                targetSha,
                url: release.html_url || ""
              }
            })
            .sort((a, b) => {
              const aIndex = commitIndexBySha.has(a.targetSha) ? commitIndexBySha.get(a.targetSha) : -1
              const bIndex = commitIndexBySha.has(b.targetSha) ? commitIndexBySha.get(b.targetSha) : -1
              return (aIndex === -1 ? Number.MAX_SAFE_INTEGER : aIndex) - (bIndex === -1 ? Number.MAX_SAFE_INTEGER : bIndex)
            })

          const releaseIndexes = existingReleases
            .map((release) => commitIndexBySha.get(release.targetSha))
            .filter((index) => Number.isInteger(index))
          const oldestReleaseIndex = releaseIndexes.length ? Math.min(...releaseIndexes) : Math.max(0, allCommits.length - maxCommits)
          const commitsSinceOldestRelease = allCommits.slice(oldestReleaseIndex)
          const commits = commitsSinceOldestRelease.slice(-maxCommits)
          const allFiles = read("../files.txt").split("\n").filter(Boolean)

          const context = {
            repository: process.env.GITHUB_REPOSITORY,
            defaultBranch: process.env.DEFAULT_BRANCH || "",
            releaseSha: process.env.RELEASE_SHA || "",
            policyPath: process.env.POLICY_PATH,
            updateExisting: process.env.UPDATE_EXISTING === "true",
            commitCount: allCommits.length,
            omittedCommitCount: allCommits.length - commits.length,
            commitWindow: {
              maxCommits,
              startIndex: commits.length ? commits[0].index : 0,
              endIndex: commits.length ? commits[commits.length - 1].index : 0,
              includesCommitsSinceOldestExistingReleaseTarget: releaseIndexes.length > 0 && commitsSinceOldestRelease.length <= maxCommits
            },
            basePolicy: read("../shared-automation/.github/release-policy.yml"),
            localPolicy: read(process.env.POLICY_PATH),
            agentsGuidance: read("AGENTS.md", 24000),
            existingReleases,
            commits,
            changedFilesAtReleaseSha: allFiles.slice(0, maxFiles),
            omittedFileCount: Math.max(0, allFiles.length - maxFiles)
          }

          fs.writeFileSync("../release-context.json", JSON.stringify(context, null, 2))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit_count=${allCommits.length}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_count=${existingReleases.length}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_sha=${context.releaseSha}\n`)
          NODE

      - name: Plan release reconciliation
        id: plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.openai-model }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const crypto = require("crypto")
          const fs = require("fs")

          ;(async () => {
            const schema = {
              type: "object",
              additionalProperties: false,
              required: ["summary", "actions"],
              properties: {
                summary: { type: "string" },
                actions: {
                  type: "array",
                  items: {
                    type: "object",
                    additionalProperties: false,
                    required: ["action", "tag", "target_sha", "title", "notes", "reason"],
                    properties: {
                      action: { type: "string", enum: ["create", "update", "skip"] },
                      tag: { type: "string" },
                      target_sha: { type: "string" },
                      title: { type: "string" },
                      notes: { type: "string" },
                      reason: { type: "string" }
                    }
                  }
                }
              }
            }

            const context = JSON.parse(fs.readFileSync("release-context.json", "utf8"))
            const existingTags = new Set(context.existingReleases.map((release) => release.tag))
            const commitShas = new Set(context.commits.map((commit) => commit.sha))

            const system = [
              "You reconcile GitHub releases for an entire repository commit history.",
              "Use the base release policy, then apply local release policy overrides.",
              "Compare every commit from the repository root through releaseSha with the existing releases.",
              "Create actions for meaningful missing release milestones between existing release targets.",
              "Update actions may improve existing release titles or notes, but must keep the existing tag and target_sha.",
              "Skip routine maintenance, formatting, minor refactoring, and small dependency chores unless their combined impact is significant.",
              "Tags must be stable version tags, must be unique, must not contain spaces or slashes, and should normally start with v.",
              "Release notes should be concise and useful to users and future maintainers.",
              "Return only JSON that matches the provided schema."
            ].join(" ")

            const body = {
              model: process.env.OPENAI_MODEL,
              input: [
                { role: "system", content: system },
                { role: "user", content: JSON.stringify(context, null, 2) }
              ],
              text: {
                format: {
                  type: "json_schema",
                  name: "release_reconciliation_plan",
                  strict: true,
                  schema
                }
              }
            }

            const controller = new AbortController()
            const timeout = setTimeout(() => controller.abort(), 120000)
            let response
            try {
              response = await fetch("https://api.openai.com/v1/responses", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.OPENAI_API_KEY}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(body),
                signal: controller.signal
              })
            } catch (error) {
              throw new Error(`OpenAI API request could not be completed: ${error.message}`)
            } finally {
              clearTimeout(timeout)
            }

            const responseText = await response.text()
            let data
            try {
              data = responseText ? JSON.parse(responseText) : {}
            } catch {
              data = { raw: responseText.slice(0, 1000) }
            }

            if (!response.ok) {
              const apiMessage = data?.error?.message || response.statusText || "unknown error"
              throw new Error(`OpenAI API request returned ${response.status}: ${apiMessage}`)
            }

            const outputText = data.output_text || (data.output || [])
              .flatMap((item) => item.content || [])
              .find((content) => content.type === "output_text")?.text

            if (!outputText) {
              throw new Error(`OpenAI response did not include output text: ${JSON.stringify(data)}`)
            }

            const plan = JSON.parse(outputText)
            plan.summary = String(plan.summary || "").trim()
            plan.actions = Array.isArray(plan.actions) ? plan.actions : []

            const tagPattern = /^v[0-9]+(\.[0-9]+){0,2}([._-][A-Za-z0-9]+)?$/
            const seenCreateTags = new Set()
            const normalizedActions = plan.actions.map((action) => ({
              action: String(action.action || "").trim(),
              tag: String(action.tag || "").trim(),
              target_sha: String(action.target_sha || "").trim(),
              title: String(action.title || "").replace(/\s+/g, " ").trim(),
              notes: String(action.notes || "").trim(),
              reason: String(action.reason || "").replace(/\s+/g, " ").trim()
            }))

            for (const action of normalizedActions) {
              if (action.action === "skip") {
                continue
              }

              if (action.action === "create") {
                if (!tagPattern.test(action.tag) || action.tag.includes("..")) {
                  throw new Error(`Invalid release tag: ${action.tag}`)
                }
                if (!commitShas.has(action.target_sha)) {
                  throw new Error(`Release target is outside the reconciled history: ${action.tag} ${action.target_sha}`)
                }
                if (!action.title) {
                  throw new Error(`Release title cannot be empty for ${action.tag}`)
                }
                if (!action.notes) {
                  throw new Error(`Release notes cannot be empty for ${action.tag}`)
                }
                if (existingTags.has(action.tag)) {
                  throw new Error(`Create action targets an existing release tag: ${action.tag}`)
                }
                if (seenCreateTags.has(action.tag)) {
                  throw new Error(`Duplicate create action for tag: ${action.tag}`)
                }
                seenCreateTags.add(action.tag)
              } else if (action.action === "update") {
                if (!context.updateExisting) {
                  action.action = "skip"
                  action.reason = `Existing release updates are disabled. ${action.reason}`.trim()
                  continue
                }
                if (!tagPattern.test(action.tag) || action.tag.includes("..")) {
                  throw new Error(`Invalid existing release tag for update action: ${action.tag}`)
                }
                if (!action.title) {
                  throw new Error(`Release title cannot be empty for update action ${action.tag}`)
                }
                if (!action.notes) {
                  throw new Error(`Release notes cannot be empty for update action ${action.tag}`)
                }
                const release = context.existingReleases.find((item) => item.tag === action.tag)
                if (!release) {
                  throw new Error(`Update action targets a missing release tag: ${action.tag}`)
                }
                if (!commitShas.has(action.target_sha)) {
                  throw new Error(`Release target is outside the reconciled commit window for update action ${action.tag}: ${action.target_sha}`)
                }
                if (release.targetSha && release.targetSha !== action.target_sha) {
                  throw new Error(`Update action cannot move ${action.tag} from ${release.targetSha} to ${action.target_sha}`)
                }
              } else {
                throw new Error(`Unsupported release action: ${action.action}`)
              }
            }

            plan.actions = normalizedActions
            fs.writeFileSync("release-plan.json", JSON.stringify(plan, null, 2))

            const createCount = plan.actions.filter((action) => action.action === "create").length
            const updateCount = plan.actions.filter((action) => action.action === "update").length
            let delimiter = ""
            do {
              delimiter = `SUMMARY_${crypto.randomBytes(12).toString("hex")}`
            } while (plan.summary.includes(delimiter))

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `create_count=${createCount}\n`)
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `update_count=${updateCount}\n`)
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary<<${delimiter}\n${plan.summary}\n${delimiter}\n`)
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Write review summary
        if: always() && steps.plan.outcome == 'success'
        working-directory: caller
        env:
          CREATE_COUNT: ${{ steps.plan.outputs.create_count }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          UPDATE_COUNT: ${{ steps.plan.outputs.update_count }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs")
          const context = JSON.parse(fs.readFileSync("../release-context.json", "utf8"))
          const plan = JSON.parse(fs.readFileSync("../release-plan.json", "utf8"))
          const escapeCell = (value) => String(value || "").replace(/\|/g, "\\|").replace(/\r?\n/g, "<br>")
          const shortSha = (value) => String(value || "").slice(0, 12)
          const counts = plan.actions.reduce((acc, action) => {
            acc[action.action] = (acc[action.action] || 0) + 1
            return acc
          }, {})

          const lines = [
            `# Release Reconciliation Review: ${context.repository}`,
            "",
            `- Target commit: \`${context.releaseSha}\``,
            `- Default branch: \`${context.defaultBranch || "unknown"}\``,
            `- Existing releases: ${context.existingReleases.length}`,
            `- Commits considered: ${context.commits.length} of ${context.commitCount}`,
            `- Omitted commits: ${context.omittedCommitCount}`,
            `- Changed files listed: ${context.changedFilesAtReleaseSha.length}`,
            `- Omitted files: ${context.omittedFileCount}`,
            `- Update existing releases: ${context.updateExisting}`,
            "",
            "## Plan Counts",
            "",
            `- Create: ${counts.create || 0}`,
            `- Update: ${counts.update || 0}`,
            `- Skip: ${counts.skip || 0}`,
            "",
            "## Summary",
            "",
            process.env.SUMMARY || plan.summary || "",
            "",
            "## Proposed Actions",
            "",
            "| Action | Tag | Target | Title | Reason |",
            "| --- | --- | --- | --- | --- |"
          ]

          for (const action of plan.actions) {
            lines.push(`| ${escapeCell(action.action)} | ${escapeCell(action.tag)} | \`${shortSha(action.target_sha)}\` | ${escapeCell(action.title)} | ${escapeCell(action.reason)} |`)
          }

          if (!plan.actions.length) {
            lines.push("| skip |  |  | No actions proposed | No release actions were proposed |")
          }

          lines.push(
            "",
            "## Review Files",
            "",
            "- `release-plan.json` contains the normalized create/update/skip proposal.",
            "- `release-context.json` contains the bounded repository context sent for planning.",
            "- `existing-releases.raw.json`, `commits.tsv`, and `files.txt` contain source inventory data.",
            "",
            "Publication is controlled separately by `publish`; report-only runs do not create tags or releases."
          )

          fs.writeFileSync("../release-review-summary.md", `${lines.join("\n")}\n`)
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`)
          NODE

      - name: Upload review artifacts
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-review-${{ github.event.repository.name }}-${{ steps.context.outputs.release_sha || github.sha }}
          path: |
            release-review-summary.md
            release-plan.json
            release-context.json
            existing-releases.raw.json
            commits.tsv
            files.txt
          if-no-files-found: error
          retention-days: ${{ inputs.review-artifact-retention-days }}

      - name: Apply release reconciliation
        id: apply
        if: inputs.dry-run == false && inputs.publish == true
        working-directory: caller
        env:
          DEFAULT_BRANCH_INPUT: ${{ inputs.default-branch }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FETCH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git_fetch_origin() {
            local auth_header
            auth_header="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" fetch "$@"
          }

          default_branch="${DEFAULT_BRANCH_INPUT:-$EVENT_DEFAULT_BRANCH}"
          if ! git_fetch_origin --force --tags origin; then
            printf "Failed to fetch tags from %s.\n" "$GITHUB_REPOSITORY" >&2
            exit 1
          fi

          if [[ -n "$default_branch" ]]; then
            if ! git_fetch_origin --force origin "$default_branch:refs/remotes/origin/$default_branch"; then
              printf "Failed to fetch default branch %s from %s.\n" "$default_branch" "$GITHUB_REPOSITORY" >&2
              exit 1
            fi
          fi

          node <<'NODE'
          const cp = require("child_process")
          const fs = require("fs")
          const context = JSON.parse(fs.readFileSync("../release-context.json", "utf8"))
          const plan = JSON.parse(fs.readFileSync("../release-plan.json", "utf8"))

          const run = (command, args) => cp.execFileSync(command, args, { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] })
          const actions = plan.actions.filter((action) => action.action === "create" || action.action === "update")
          const applied = []
          const failed = []

          for (const [index, action] of actions.entries()) {
            const notesFile = `../release-notes-${index}.md`
            fs.writeFileSync(notesFile, `${action.notes}\n`)

            try {
              run("git", ["cat-file", "-e", `${action.target_sha}^{commit}`])
              if (process.env.DEFAULT_BRANCH_INPUT || process.env.EVENT_DEFAULT_BRANCH) {
                const defaultBranch = process.env.DEFAULT_BRANCH_INPUT || process.env.EVENT_DEFAULT_BRANCH
                run("git", ["merge-base", "--is-ancestor", action.target_sha, `origin/${defaultBranch}`])
              }

              if (action.action === "create") {
                let tagSha = ""
                try {
                  tagSha = run("git", ["rev-list", "-n", "1", `refs/tags/${action.tag}^{}`]).trim()
                } catch {
                  tagSha = ""
                }
                if (tagSha && tagSha !== action.target_sha) {
                  throw new Error(`Release tag ${action.tag} points to ${tagSha}, not ${action.target_sha}`)
                }

                const latestArgs = action.target_sha === context.releaseSha ? ["--latest"] : ["--latest=false"]
                run("gh", ["release", "create", action.tag, "--target", action.target_sha, "--title", action.title, "--notes-file", notesFile, ...latestArgs])
              } else {
                run("gh", ["release", "edit", action.tag, "--title", action.title, "--notes-file", notesFile])
              }

              applied.push({ action: action.action, tag: action.tag, target_sha: action.target_sha })
            } catch (error) {
              failed.push({
                action: action.action,
                tag: action.tag,
                target_sha: action.target_sha,
                message: error.stderr?.toString().trim() || error.message
              })
            }
          }

          fs.writeFileSync("../release-apply-results.json", JSON.stringify({ applied, failed }, null, 2))
          console.log(`Applied ${applied.length} release actions with ${failed.length} failures.`)

          if (failed.length) {
            for (const failure of failed) {
              console.error(`${failure.action} ${failure.tag} failed: ${failure.message}`)
            }
            process.exit(1)
          }
          NODE

      - name: Report release reconciliation
        if: always() && steps.plan.outcome == 'success'
        working-directory: caller
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          CREATE_COUNT: ${{ steps.plan.outputs.create_count }}
          DRY_RUN: ${{ inputs.dry-run }}
          PR_NUMBER: ${{ inputs.pr-number }}
          PUBLISH: ${{ inputs.publish }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          UPDATE_COUNT: ${{ steps.plan.outputs.update_count }}
        run: |
          set -euo pipefail

          printf "Release reconciliation planned %s creates and %s updates.\n" "$CREATE_COUNT" "$UPDATE_COUNT"
          printf "%s\n" "$SUMMARY"

          applied_count="0"
          failed_count="0"
          if [[ -f ../release-apply-results.json ]]; then
            applied_count="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("../release-apply-results.json","utf8")); console.log((data.applied || []).length)')"
            failed_count="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("../release-apply-results.json","utf8")); console.log((data.failed || []).length)')"
            printf "Release reconciliation applied %s actions with %s failures.\n" "$applied_count" "$failed_count"
          fi

          if [[ "$DRY_RUN" == "true" || "$PUBLISH" != "true" ]]; then
            printf "Release reconciliation was not applied because publish=%s and dry-run=%s.\n" "$PUBLISH" "$DRY_RUN"
          fi

          if [[ -n "$PR_NUMBER" ]]; then
            if [[ -f ../release-apply-results.json ]]; then
              gh pr comment "$PR_NUMBER" --body "Release reconciliation planned ${CREATE_COUNT} creates and ${UPDATE_COUNT} updates. Applied ${applied_count} actions with ${failed_count} failures. ${SUMMARY}"
            else
              gh pr comment "$PR_NUMBER" --body "Release reconciliation planned ${CREATE_COUNT} creates and ${UPDATE_COUNT} updates. ${SUMMARY}"
            fi
          fi
