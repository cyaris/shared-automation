name: Shared auto release

on:
  workflow_call:
    inputs:
      release-sha:
        description: Commit SHA to reconcile releases through. Blank uses the default branch tip.
        required: false
        type: string
        default: ""
      pr-number:
        description: Optional pull request number to comment on.
        required: false
        type: string
        default: ""
      policy-path:
        description: Local release policy path in the caller repository.
        required: false
        type: string
        default: .github/release-policy.yml
      openai-model:
        description: OpenAI model used to reconcile release milestones and notes.
        required: false
        type: string
        default: gpt-5-mini
      default-branch:
        description: Default branch name. Leave blank to use the repository default branch.
        required: false
        type: string
        default: ""
      dry-run:
        description: Decide and report release changes without applying them.
        required: false
        type: boolean
        default: false
      publish:
        description: Apply selected release creates and updates. Keep false to report the plan only.
        required: false
        type: boolean
        default: false
      update-existing:
        description: Allow updates to existing release titles and notes.
        required: false
        type: boolean
        default: true
      review-artifact-retention-days:
        description: Days to retain report-only review artifacts.
        required: false
        type: number
        default: 30
      shared-automation-repository:
        description: Repository containing the shared release policy.
        required: false
        type: string
        default: ""
      shared-automation-ref:
        description: Ref used to read the shared release policy.
        required: false
        type: string
        default: ""
      allowed-dispatch-actor:
        description: GitHub actor allowed to run this workflow from workflow_dispatch callers.
        required: false
        type: string
        default: cyaris
    secrets:
      OPENAI_API_KEY:
        description: OpenAI API key used for automated release decisions.
        required: true
      RELEASE_TOKEN:
        description: Optional token with permission to create releases and tags.
        required: false
      CHECKOUT_TOKEN:
        description: Optional token with read access to the shared automation repository.
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-release-${{ github.repository }}-${{ inputs.release-sha || github.sha }}
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      RELEASE_ARTIFACT_DIR: ${{ github.workspace }}

    steps:
      - name: Validate manual dispatcher
        if: ${{ github.event_name == 'workflow_dispatch' && github.actor != inputs['allowed-dispatch-actor'] }}
        env:
          ALLOWED_DISPATCH_ACTOR: ${{ inputs['allowed-dispatch-actor'] }}
        run: |
          set -euo pipefail

          printf "Manual dispatch is restricted to %s.\n" "$ALLOWED_DISPATCH_ACTOR" >&2
          exit 1

      - name: Check release decision credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$OPENAI_API_KEY" ]]; then
            printf "OPENAI_API_KEY is required for release reconciliation.\n" >&2
            exit 1
          fi

      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: caller
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Checkout shared release policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.shared-automation-repository || 'cyaris/shared-automation' }}
          ref: ${{ inputs.shared-automation-ref || 'main' }}
          path: shared-automation
          persist-credentials: false
          token: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Gather release context
        id: context
        working-directory: caller
        env:
          DEFAULT_BRANCH_INPUT: ${{ inputs.default-branch }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FETCH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          POLICY_PATH: ${{ inputs.policy-path }}
          RELEASE_SHA_INPUT: ${{ inputs.release-sha }}
          UPDATE_EXISTING: ${{ inputs.update-existing }}
        run: |
          set -euo pipefail

          git_fetch_origin() {
            local auth_header
            auth_header="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" fetch "$@"
          }

          default_branch="${DEFAULT_BRANCH_INPUT:-$EVENT_DEFAULT_BRANCH}"
          if ! git_fetch_origin --force --tags origin; then
            printf "Failed to fetch tags from %s.\n" "$GITHUB_REPOSITORY" >&2
            exit 1
          fi

          if [[ -n "$default_branch" ]]; then
            if ! git_fetch_origin --force origin "$default_branch:refs/remotes/origin/$default_branch"; then
              printf "Failed to fetch default branch %s from %s.\n" "$default_branch" "$GITHUB_REPOSITORY" >&2
              exit 1
            fi
          fi

          release_sha="$RELEASE_SHA_INPUT"
          if [[ -z "$release_sha" ]]; then
            if [[ -n "$default_branch" ]]; then
              release_sha="$(git rev-parse "origin/$default_branch")"
            else
              release_sha="$(git rev-parse HEAD)"
            fi
          fi

          if ! git cat-file -e "${release_sha}^{commit}"; then
            if ! git_fetch_origin --force origin "$release_sha"; then
              printf "Failed to fetch release_sha %s from %s.\n" "$release_sha" "$GITHUB_REPOSITORY" >&2
              exit 1
            fi
          fi

          if [[ -n "$default_branch" ]]; then
            if ! git merge-base --is-ancestor "$release_sha" "origin/$default_branch"; then
              printf "release_sha %s is not an ancestor of origin/%s.\n" "$release_sha" "$default_branch" >&2
              exit 1
            fi
          fi

          git log --reverse --date=short --format="%H%x09%h%x09%ad%x09%s" "$release_sha" -- > "$RELEASE_ARTIFACT_DIR/commits.tsv"
          git ls-tree -r --name-only "$release_sha" > "$RELEASE_ARTIFACT_DIR/files.txt"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp \
            > "$RELEASE_ARTIFACT_DIR/existing-releases.raw.json"

          export DEFAULT_BRANCH="$default_branch"
          export RELEASE_SHA="$release_sha"

          node ../shared-automation/.github/scripts/gather-release-context.js

      - name: Plan release reconciliation
        id: plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.openai-model }}
        run: |
          set -euo pipefail

          node shared-automation/.github/scripts/plan-release-reconciliation.js

      - name: Write review summary
        if: always() && steps.plan.outcome == 'success'
        working-directory: caller
        env:
          CREATE_COUNT: ${{ steps.plan.outputs.create_count }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          UPDATE_COUNT: ${{ steps.plan.outputs.update_count }}
        run: |
          set -euo pipefail

          node ../shared-automation/.github/scripts/build-release-summary.js

      - name: Upload review artifacts
        if: always() && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-review-${{ github.event.repository.name }}-${{ steps.context.outputs.release_sha || github.sha }}
          path: |
            release-review-summary.md
            release-plan.json
            release-context.json
            existing-releases.raw.json
            commits.tsv
            files.txt
          if-no-files-found: error
          retention-days: ${{ inputs.review-artifact-retention-days }}

      - name: Apply release reconciliation
        id: apply
        if: inputs.dry-run == false && inputs.publish == true
        working-directory: caller
        env:
          DEFAULT_BRANCH_INPUT: ${{ inputs.default-branch }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FETCH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git_fetch_origin() {
            local auth_header
            auth_header="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" fetch "$@"
          }

          default_branch="${DEFAULT_BRANCH_INPUT:-$EVENT_DEFAULT_BRANCH}"
          if ! git_fetch_origin --force --tags origin; then
            printf "Failed to fetch tags from %s.\n" "$GITHUB_REPOSITORY" >&2
            exit 1
          fi

          if [[ -n "$default_branch" ]]; then
            if ! git_fetch_origin --force origin "$default_branch:refs/remotes/origin/$default_branch"; then
              printf "Failed to fetch default branch %s from %s.\n" "$default_branch" "$GITHUB_REPOSITORY" >&2
              exit 1
            fi
          fi

          node ../shared-automation/.github/scripts/apply-release-reconciliation.js

      - name: Report release reconciliation
        if: always() && steps.plan.outcome == 'success'
        working-directory: caller
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          CREATE_COUNT: ${{ steps.plan.outputs.create_count }}
          DRY_RUN: ${{ inputs.dry-run }}
          PR_NUMBER: ${{ inputs.pr-number }}
          PUBLISH: ${{ inputs.publish }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          UPDATE_COUNT: ${{ steps.plan.outputs.update_count }}
        run: |
          set -euo pipefail

          printf "Release reconciliation planned %s creates and %s updates.\n" "$CREATE_COUNT" "$UPDATE_COUNT"
          printf "%s\n" "$SUMMARY"

          apply_results_file="$RELEASE_ARTIFACT_DIR/release-apply-results.json"

          applied_count="0"
          failed_count="0"
          if [[ -f "$apply_results_file" ]]; then
            applied_count="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log((data.applied || []).length)' "$apply_results_file")"
            failed_count="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log((data.failed || []).length)' "$apply_results_file")"
            printf "Release reconciliation applied %s actions with %s failures.\n" "$applied_count" "$failed_count"
          fi

          if [[ "$DRY_RUN" == "true" || "$PUBLISH" != "true" ]]; then
            printf "Release reconciliation was not applied because publish=%s and dry-run=%s.\n" "$PUBLISH" "$DRY_RUN"
          fi

          if [[ -n "$PR_NUMBER" ]]; then
            if [[ -f "$apply_results_file" ]]; then
              gh pr comment "$PR_NUMBER" --body "Release reconciliation planned ${CREATE_COUNT} creates and ${UPDATE_COUNT} updates. Applied ${applied_count} actions with ${failed_count} failures. ${SUMMARY}"
            else
              gh pr comment "$PR_NUMBER" --body "Release reconciliation planned ${CREATE_COUNT} creates and ${UPDATE_COUNT} updates. ${SUMMARY}"
            fi
          fi
