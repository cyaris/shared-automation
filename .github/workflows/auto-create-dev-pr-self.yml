name: Auto-create dev pull request

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-create-dev-pr:
    concurrency:
      group: auto-create-dev-pr-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false

    uses: ./.github/workflows/auto-create-dev-pr.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
