name: Auto-create dev pull request

on:
  push:
    branches:
      - dev

concurrency:
  group: auto-create-dev-pr-${{ github.repository }}-dev
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-create-dev-pr:
    uses: ./.github/workflows/auto-create-dev-pr.yml
