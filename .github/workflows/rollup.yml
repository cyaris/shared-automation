name: Shared Rollup

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the package.json to validate and roll up.
        required: false
        type: string
        default: .
      dist-directory:
        description: Dist directory, relative to the repository root.
        required: false
        type: string
        default: dist
      bundle-files:
        description: Newline-separated bundle file specs as path:content-type, relative to dist-directory.
        required: true
        type: string
      s3-bucket:
        description: Destination S3 bucket.
        required: false
        type: string
        default: cyaris.github.io
      s3-prefix:
        description: Destination prefix inside the S3 bucket.
        required: true
        type: string
      aws-region:
        description: AWS region for S3 and STS calls.
        required: false
        type: string
        default: us-east-2
      aws-role-to-assume:
        description: Optional AWS role ARN for OIDC authentication. If omitted, AWS access key secrets are used.
        required: false
        type: string
        default: ""
      manual-dry-run:
        description: Manual dispatch dry-run input from the caller wrapper.
        required: false
        type: boolean
        default: false
      sync-dist-extras:
        description: Sync non-bundle files from dist-directory to the S3 prefix.
        required: false
        type: boolean
        default: false
      cache-control:
        description: Cache-Control metadata for uploaded bundle and optional extra files.
        required: false
        type: string
        default: no-cache, max-age=0, must-revalidate
      metadata-refresh-files:
        description: Optional newline-separated S3 object specs as key:content-type to refresh metadata in place.
        required: false
        type: string
        default: ""
      node-version:
        description: Node.js version used for npm installs and builds.
        required: false
        type: string
        default: "24"
      shared-automation-repository:
        description: Repository containing the shared rollup upload action.
        required: false
        type: string
        default: cyaris/shared-automation
      shared-automation-ref:
        description: Ref used to checkout the shared rollup upload action.
        required: false
        type: string
        default: main
      svelte-lib-repository:
        description: Repository containing svelte-lib.
        required: false
        type: string
        default: cyaris/svelte-lib
      local-dependency-repositories:
        description: Optional newline-separated local dependency specs used by both CI and rollup upload as owner/repo:path:ref.
        required: false
        type: string
        default: ""
      run-format:
        description: Run npm run format:check during CI.
        required: false
        type: boolean
        default: true
      run-lint:
        description: Run npm run lint during CI.
        required: false
        type: boolean
        default: true
      run-check:
        description: Run npm run check during CI.
        required: false
        type: boolean
        default: true
      run-build:
        description: Run npm run build during CI.
        required: false
        type: boolean
        default: true
      allowed-dispatch-actor:
        description: GitHub actor allowed to run this workflow from workflow_dispatch callers.
        required: false
        type: string
        default: cyaris
    secrets:
      CHECKOUT_TOKEN:
        description: Optional token with access to private dependency repositories.
        required: false
      RELEASE_TOKEN:
        description: Optional fallback token with access to private dependency repositories.
        required: false
      AWS_ACCESS_KEY_ID:
        description: AWS access key used when aws-role-to-assume is omitted.
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: AWS secret key used when aws-role-to-assume is omitted.
        required: false
      AWS_SESSION_TOKEN:
        description: Optional AWS session token used when aws-role-to-assume is omitted.
        required: false

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ci_local_dependency_repositories: ${{ steps.values.outputs.ci_local_dependency_repositories }}
      dry_run: ${{ steps.values.outputs.dry_run }}
      production: ${{ steps.values.outputs.production }}
      rollup_local_dependency_repositories: ${{ steps.values.outputs.rollup_local_dependency_repositories }}
      svelte_lib_ref: ${{ steps.values.outputs.svelte_lib_ref }}
    steps:
      - id: values
        env:
          CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.manual-dry-run }}
          LOCAL_DEPENDENCY_REPOSITORIES: ${{ inputs.local-dependency-repositories }}
          SVELTE_LIB_REPOSITORY: ${{ inputs.svelte-lib-repository }}
        run: |
          set -euo pipefail

          resolve_github_ref() {
            local repository="$1"
            local ref="$2"
            local label="$3"
            local auth_header
            local git_config=()
            local last_error
            local pattern
            local resolved
            local result

            if [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf "%s\n" "${ref,,}"
              return
            fi

            if [[ -n "$CHECKOUT_TOKEN" ]]; then
              auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
              git_config=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header")
            fi

            last_error="$(mktemp)"
            for pattern in "refs/heads/$ref" "refs/tags/$ref^{}" "refs/tags/$ref" "$ref"; do
              : > "$last_error"
              if result="$(git "${git_config[@]}" ls-remote --exit-code "https://github.com/${repository}.git" "$pattern" 2>"$last_error")"; then
                resolved="$(awk 'NR == 1 { print $1 }' <<< "$result")"
              else
                resolved=""
              fi

              if [[ -n "$resolved" ]]; then
                rm -f "$last_error"
                printf "%s\n" "$resolved"
                return
              fi
            done

            printf "Failed to resolve %s ref %s in %s.\n" "$label" "$ref" "$repository" >&2
            if [[ -n "${last_error:-}" && -s "$last_error" ]]; then
              printf "Last git ls-remote error while resolving %s:\n" "$label" >&2
              sed 's/x-access-token:[^@]*/x-access-token:***/g' "$last_error" >&2
            fi
            rm -f "${last_error:-}"
            exit 1
          }

          resolve_local_dependency_repositories() {
            local specs="$1"
            local spec
            local repository
            local checkout_path
            local ref
            local resolved_ref

            while IFS= read -r spec; do
              if [[ -z "$spec" ]]; then
                continue
              fi

              if [[ "$spec" == *:*:*:* ]]; then
                printf "Invalid local dependency spec: %s\n" "$spec" >&2
                exit 1
              fi

              IFS=: read -r repository checkout_path ref <<< "$spec"

              if [[ -z "${repository:-}" || -z "${checkout_path:-}" || -z "${ref:-}" ]]; then
                printf "Invalid local dependency spec: %s\n" "$spec" >&2
                exit 1
              fi

              resolved_ref="$(resolve_github_ref "$repository" "$ref" "$repository")"
              printf "%s:%s:%s\n" "$repository" "$checkout_path" "$resolved_ref"
            done <<< "$specs"
          }

          production="false"
          dry_run="$INPUT_DRY_RUN"
          default_svelte_lib_ref="main"
          svelte_lib_ref="$default_svelte_lib_ref"

          if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "master" ]]; then
            production="true"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF_NAME" == "dev" || "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "master" ) ]]; then
            dry_run="false"
          fi

          svelte_lib_ref="$(resolve_github_ref "$SVELTE_LIB_REPOSITORY" "$svelte_lib_ref" "svelte-lib")"
          resolved_local_dependency_repositories="$(resolve_local_dependency_repositories "$LOCAL_DEPENDENCY_REPOSITORIES")"

          {
            printf "ci_local_dependency_repositories<<ROLLUP_CI_DEPS\n"
            printf "%s:svelte-lib:%s\n" "$SVELTE_LIB_REPOSITORY" "$svelte_lib_ref"
            printf "%s\n" "$resolved_local_dependency_repositories"
            printf "ROLLUP_CI_DEPS\n"
            printf "dry_run=%s\n" "$dry_run"
            printf "production=%s\n" "$production"
            printf "rollup_local_dependency_repositories<<ROLLUP_UPLOAD_DEPS\n"
            printf "%s\n" "$resolved_local_dependency_repositories"
            printf "ROLLUP_UPLOAD_DEPS\n"
            printf "svelte_lib_ref=%s\n" "$svelte_lib_ref"
          } >> "$GITHUB_OUTPUT"

  node-package-ci:
    needs: resolve-inputs
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}
      local-dependency-repositories: ${{ needs.resolve-inputs.outputs.ci_local_dependency_repositories }}
      run-format: ${{ inputs.run-format }}
      run-lint: ${{ inputs.run-lint }}
      run-check: ${{ inputs.run-check }}
      run-build: ${{ inputs.run-build }}
      allowed-dispatch-actor: ${{ inputs.allowed-dispatch-actor }}
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  rollup-upload:
    needs:
      - node-package-ci
      - resolve-inputs
    concurrency:
      group: rollup-upload-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatcher
        if: ${{ github.event_name == 'workflow_dispatch' && github.actor != inputs['allowed-dispatch-actor'] }}
        env:
          ALLOWED_DISPATCH_ACTOR: ${{ inputs['allowed-dispatch-actor'] }}
        run: |
          set -euo pipefail

          printf "Manual dispatch is restricted to %s.\n" "$ALLOWED_DISPATCH_ACTOR" >&2
          exit 1

      - name: Check upload freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/${REPOSITORY}/commits/${REF_NAME}" --jq .sha)"

          if [[ "$current_sha" != "$RUN_SHA" ]]; then
            printf "::warning::Skipping upload: %s is no longer the head of %s (current head is %s). A newer run already handled this push.\n" \
              "$RUN_SHA" "$REF_NAME" "$current_sha"
            printf "is_current=false\n" >> "$GITHUB_OUTPUT"
          else
            printf "is_current=true\n" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout caller repository
        if: steps.freshness.outputs.is_current == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: false

      - name: Checkout svelte-lib
        if: steps.freshness.outputs.is_current == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.svelte-lib-repository }}
          ref: ${{ needs.resolve-inputs.outputs.svelte_lib_ref }}
          path: svelte-lib
          token: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout shared automation
        if: steps.freshness.outputs.is_current == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.shared-automation-repository }}
          ref: ${{ inputs.shared-automation-ref }}
          path: shared-automation
          token: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: false

      - name: Rollup and upload embedded bundle
        if: steps.freshness.outputs.is_current == 'true'
        uses: ./shared-automation/.github/actions/rollup-upload
        with:
          caller-repository-name: ${{ github.event.repository.name }}
          working-directory: ${{ inputs.working-directory }}
          dist-directory: ${{ inputs.dist-directory }}
          bundle-files: ${{ inputs.bundle-files }}
          s3-bucket: ${{ inputs.s3-bucket }}
          s3-prefix: ${{ inputs.s3-prefix }}
          aws-region: ${{ inputs.aws-region }}
          aws-role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          production: ${{ needs.resolve-inputs.outputs.production == 'true' }}
          dry-run: ${{ needs.resolve-inputs.outputs.dry_run == 'true' }}
          sync-dist-extras: ${{ inputs.sync-dist-extras }}
          cache-control: ${{ inputs.cache-control }}
          metadata-refresh-files: ${{ inputs.metadata-refresh-files }}
          node-version: ${{ inputs.node-version }}
          svelte-lib-directory: svelte-lib
          checkout-token: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN || github.token }}
          local-dependency-repositories: ${{ needs.resolve-inputs.outputs.rollup_local_dependency_repositories }}
