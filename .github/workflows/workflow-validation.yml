name: Workflow validation

on:
  workflow_call:
    inputs:
      json-files:
        description: Newline-separated JSON configuration files to validate.
        required: false
        type: string
        default: |
          renovate.json
      allowed-dispatch-actor:
        description: GitHub actor allowed to run this workflow from workflow_dispatch callers.
        required: false
        type: string
        default: cyaris
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/release-policy.yml"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "README.md"
      - "renovate.json"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/release-policy.yml"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "README.md"
      - "renovate.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manual-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatcher
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ALLOWED_DISPATCH_ACTOR: ${{ inputs['allowed-dispatch-actor'] || 'cyaris' }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_ACTOR" != "$ALLOWED_DISPATCH_ACTOR" ]]; then
            printf "Manual dispatch is restricted to %s.\n" "$ALLOWED_DISPATCH_ACTOR" >&2
            exit 1
          fi

  actionlint:
    needs: validate-manual-dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: |
          "$HOME/go/bin/actionlint" -color

  json-config:
    needs: validate-manual-dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate JSON configuration
        env:
          JSON_FILES: ${{ inputs['json-files'] }}
        run: |
          set -euo pipefail

          if [[ -z "${JSON_FILES:-}" ]]; then
            JSON_FILES="renovate.json"
          fi

          while IFS= read -r file; do
            file="${file#"${file%%[![:space:]]*}"}"
            file="${file%"${file##*[![:space:]]}"}"

            if [[ -z "$file" ]]; then
              continue
            fi

            if [[ ! -f "$file" ]]; then
              printf "Configured JSON file does not exist: %s\n" "$file" >&2
              exit 1
            fi

            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done <<< "$JSON_FILES"

  zizmor:
    needs: validate-manual-dispatch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          set -euo pipefail

          python3 -m pip install --user zizmor==1.28.0
          printf "%s/.local/bin\n" "$HOME" >> "$GITHUB_PATH"

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  cyaris/shared-automation/*: ref-pin
                  "*": hash-pin
          EOF

          zizmor --config "$RUNNER_TEMP/zizmor.yml" --format=github .
