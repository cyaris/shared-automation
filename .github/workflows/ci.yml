name: Shared Node package CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the package.json to validate.
        required: false
        type: string
        default: .
      node-version:
        description: Node.js version used for installs and checks.
        required: false
        type: string
        default: "24"
      local-dependency-repositories:
        description: Optional newline-separated local dependency specs as owner/repo:path:ref.
        required: false
        type: string
        default: ""
      run-format:
        description: Run npm run format:check.
        required: false
        type: boolean
        default: true
      run-lint:
        description: Run npm run lint.
        required: false
        type: boolean
        default: true
      run-check:
        description: Run npm run check.
        required: false
        type: boolean
        default: true
      run-build:
        description: Run npm run build.
        required: false
        type: boolean
        default: true
      allowed-dispatch-actor:
        description: GitHub actor allowed to run this workflow from workflow_dispatch callers.
        required: false
        type: string
        default: cyaris
    secrets:
      CHECKOUT_TOKEN:
        description: Optional token with access to private local dependency repositories.
        required: false
      RELEASE_TOKEN:
        description: Optional fallback token with access to private dependency repositories.
        required: false

permissions:
  contents: read

jobs:
  node-package-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatcher
        if: ${{ github.event_name == 'workflow_dispatch' && github.actor != inputs['allowed-dispatch-actor'] }}
        env:
          ALLOWED_DISPATCH_ACTOR: ${{ inputs['allowed-dispatch-actor'] }}
        run: |
          printf "Manual dispatch is restricted to %s.\n" "$ALLOWED_DISPATCH_ACTOR" >&2
          exit 1

      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: false

      - name: Checkout local dependencies
        if: inputs.local-dependency-repositories != ''
        env:
          FETCH_TOKEN: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN || github.token }}
          LOCAL_DEPENDENCY_REPOSITORIES: ${{ inputs.local-dependency-repositories }}
        run: |
          set -euo pipefail

          while IFS= read -r spec; do
            spec="${spec#"${spec%%[![:space:]]*}"}"
            spec="${spec%"${spec##*[![:space:]]}"}"

            if [[ -z "$spec" ]]; then
              continue
            fi

            IFS=: read -r repository path ref extra <<< "$spec"

            if [[ -n "${extra:-}" || -z "${repository:-}" || -z "${path:-}" || -z "${ref:-}" ]]; then
              printf "Invalid local dependency spec: %s\n" "$spec" >&2
              exit 1
            fi

            auth_header="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"

            if [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
                clone --no-checkout --depth 1 "https://github.com/${repository}.git" "$path"
              git -C "$path" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
                fetch --depth 1 origin "$ref"
              git -C "$path" checkout --detach FETCH_HEAD
            else
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
                clone --branch "$ref" --depth 1 "https://github.com/${repository}.git" "$path"
            fi
          done <<< "$LOCAL_DEPENDENCY_REPOSITORIES"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory == '.' && format('{0}/package-lock.json', github.event.repository.name) || format('{0}/{1}/package-lock.json', github.event.repository.name, inputs.working-directory) }}

      - name: Install and build local dependencies
        if: inputs.local-dependency-repositories != ''
        env:
          LOCAL_DEPENDENCY_REPOSITORIES: ${{ inputs.local-dependency-repositories }}
        run: |
          set -euo pipefail

          while IFS= read -r spec; do
            spec="${spec#"${spec%%[![:space:]]*}"}"
            spec="${spec%"${spec##*[![:space:]]}"}"

            if [[ -z "$spec" ]]; then
              continue
            fi

            IFS=: read -r repository path ref extra <<< "$spec"

            if [[ -n "${extra:-}" || -z "${repository:-}" || -z "${path:-}" || -z "${ref:-}" ]]; then
              printf "Invalid local dependency spec: %s\n" "$spec" >&2
              exit 1
            fi

            if [[ -f "$path/package-lock.json" ]]; then
              npm --prefix "$path" ci
            else
              npm --prefix "$path" install
            fi

            npm --prefix "$path" run build
          done <<< "$LOCAL_DEPENDENCY_REPOSITORIES"

      - name: Install dependencies
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: npm ci

      - name: Check formatting
        if: inputs.run-format
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: npm run format:check

      - name: Lint
        if: inputs.run-lint
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: npm run lint

      - name: Check package
        if: inputs.run-check
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: npm run check

      - name: Build
        if: inputs.run-build
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: npm run build
