name: Shared Upstream Watch

on:
  workflow_call:
    inputs:
      svelte-lib-repository:
        description: Repository containing svelte-lib.
        required: false
        type: string
        default: cyaris/svelte-lib
      local-dependency-repositories:
        description: Optional newline-separated local dependency specs to watch, as owner/repo:path:ref.
        required: false
        type: string
        default: ""
      rollup-workflow-file:
        description: Workflow file name in the caller repository to dispatch when an upstream dependency has changed.
        required: false
        type: string
        default: rollup.yml
      dispatch-ref:
        description: Branch to dispatch the rollup workflow on.
        required: true
        type: string
      allowed-dispatch-actor:
        description: GitHub actor allowed to run this workflow from workflow_dispatch callers.
        required: false
        type: string
        default: cyaris
    secrets:
      CHECKOUT_TOKEN:
        description: Optional token with access to read upstream repositories and read/write repository variables.
        required: false
      RELEASE_TOKEN:
        description: Optional fallback token with access to read upstream repositories and read/write repository variables.
        required: false

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Validate manual dispatcher
        if: ${{ github.event_name == 'workflow_dispatch' && github.actor != inputs['allowed-dispatch-actor'] }}
        env:
          ALLOWED_DISPATCH_ACTOR: ${{ inputs['allowed-dispatch-actor'] }}
        run: |
          set -euo pipefail

          printf "Manual dispatch is restricted to %s.\n" "$ALLOWED_DISPATCH_ACTOR" >&2
          exit 1

      - name: Require a variable-capable token
        env:
          VARIABLE_TOKEN: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$VARIABLE_TOKEN" ]]; then
            printf "upstream-watch requires CHECKOUT_TOKEN or RELEASE_TOKEN to read upstream commits and read/write repository variables.\n" >&2
            exit 1
          fi

      - name: Resolve and compare upstream refs
        id: check
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN }}
          LOCAL_DEPENDENCY_REPOSITORIES: ${{ inputs.local-dependency-repositories }}
          REPOSITORY: ${{ github.repository }}
          SVELTE_LIB_REPOSITORY: ${{ inputs.svelte-lib-repository }}
        run: |
          set -euo pipefail

          resolve_github_ref() {
            local repository="$1"
            local ref="$2"
            local auth_header
            local git_config=()
            local last_error
            local pattern
            local resolved
            local result

            if [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf "%s\n" "${ref,,}"
              return
            fi

            if [[ -n "$GH_TOKEN" ]]; then
              auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
              git_config=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header")
            fi

            last_error="$(mktemp)"
            for pattern in "refs/heads/$ref" "refs/tags/$ref^{}" "refs/tags/$ref" "$ref"; do
              : > "$last_error"
              if result="$(git "${git_config[@]}" ls-remote --exit-code "https://github.com/${repository}.git" "$pattern" 2>"$last_error")"; then
                resolved="$(awk 'NR == 1 { print $1 }' <<< "$result")"
              else
                resolved=""
              fi

              if [[ -n "$resolved" ]]; then
                rm -f "$last_error"
                printf "%s\n" "$resolved"
                return
              fi
            done

            printf "Failed to resolve ref %s in %s.\n" "$ref" "$repository" >&2
            if [[ -n "${last_error:-}" && -s "$last_error" ]]; then
              sed 's/x-access-token:[^@]*/x-access-token:***/g' "$last_error" >&2
            fi
            rm -f "${last_error:-}"
            exit 1
          }

          variable_name_for() {
            local checkout_path="$1"

            printf "UPSTREAM_%s_SHA\n" "$(tr '[:lower:]-' '[:upper:]_' <<< "$checkout_path")"
          }

          stored_value_for() {
            local variable_name="$1"

            gh variable get "$variable_name" -R "$REPOSITORY" --jq .value 2>/dev/null || printf ""
          }

          changed="false"
          variable_updates=""
          summary=""

          check_dependency() {
            local label="$1"
            local repository="$2"
            local ref="$3"
            local checkout_path="$4"
            local variable_name
            local current_sha
            local stored_sha

            variable_name="$(variable_name_for "$checkout_path")"
            current_sha="$(resolve_github_ref "$repository" "$ref")"
            stored_sha="$(stored_value_for "$variable_name")"

            if [[ -z "$stored_sha" ]]; then
              printf "No stored SHA yet for %s (%s); seeding %s without triggering a rollup.\n" "$label" "$variable_name" "$current_sha"
              variable_updates="${variable_updates}${variable_name}=${current_sha}"$'\n'
            elif [[ "$current_sha" != "$stored_sha" ]]; then
              printf "%s changed: %s -> %s\n" "$label" "$stored_sha" "$current_sha"
              changed="true"
              variable_updates="${variable_updates}${variable_name}=${current_sha}"$'\n'
              summary="${summary}${label} ${stored_sha} -> ${current_sha}"$'\n'
            else
              printf "%s unchanged at %s.\n" "$label" "$current_sha"
            fi
          }

          check_dependency "svelte-lib" "$SVELTE_LIB_REPOSITORY" "main" "svelte-lib"

          while IFS= read -r spec; do
            if [[ -z "$spec" ]]; then
              continue
            fi

            if [[ "$spec" == *:*:*:* ]]; then
              printf "Invalid local dependency spec: %s\n" "$spec" >&2
              exit 1
            fi

            IFS=: read -r dep_repository dep_checkout_path dep_ref <<< "$spec"

            if [[ -z "${dep_repository:-}" || -z "${dep_checkout_path:-}" || -z "${dep_ref:-}" ]]; then
              printf "Invalid local dependency spec: %s\n" "$spec" >&2
              exit 1
            fi

            check_dependency "$dep_checkout_path" "$dep_repository" "$dep_ref" "$dep_checkout_path"
          done <<< "$LOCAL_DEPENDENCY_REPOSITORIES"

          {
            printf "changed=%s\n" "$changed"
            printf "variable_updates<<UPSTREAM_WATCH_VARS\n"
            printf "%s" "$variable_updates"
            printf "UPSTREAM_WATCH_VARS\n"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$summary" ]]; then
            printf "%s" "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dispatch rollup workflow
        if: steps.check.outputs.changed == 'true'
        env:
          DISPATCH_REF: ${{ inputs.dispatch-ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ROLLUP_WORKFLOW_FILE: ${{ inputs.rollup-workflow-file }}
        run: |
          set -euo pipefail

          gh workflow run "$ROLLUP_WORKFLOW_FILE" -R "$REPOSITORY" --ref "$DISPATCH_REF"

      - name: Record latest upstream refs
        if: steps.check.outputs.variable_updates != ''
        env:
          GH_TOKEN: ${{ secrets.CHECKOUT_TOKEN || secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VARIABLE_UPDATES: ${{ steps.check.outputs.variable_updates }}
        run: |
          set -euo pipefail

          while IFS= read -r update; do
            if [[ -z "$update" ]]; then
              continue
            fi

            name="${update%%=*}"
            value="${update#*=}"

            gh variable set "$name" --body "$value" -R "$REPOSITORY"
          done <<< "$VARIABLE_UPDATES"
