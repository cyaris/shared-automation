name: Shared Python CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the pyproject.toml to validate.
        required: false
        type: string
        default: .
      python-version:
        description: Python version used for installs and checks.
        required: false
        type: string
        default: "3.11"
      run-black:
        description: Run Black in check mode.
        required: false
        type: boolean
        default: true
      run-isort:
        description: Run isort in check mode.
        required: false
        type: boolean
        default: true
      run-pytest:
        description: Run pytest.
        required: false
        type: boolean
        default: true
      pre-test-python-script:
        description: Optional repository-relative Python script to run from the working directory before pytest.
        required: false
        type: string
        default: ""
      data-cache-path:
        description: Optional working-directory-relative path containing prepared test data to cache.
        required: false
        type: string
        default: ""
      data-cache-key:
        description: Optional caller-controlled version key for the prepared test-data cache.
        required: false
        type: string
        default: ""
      allowed-dispatch-actor:
        description: GitHub actor allowed to run this workflow from workflow_dispatch callers.
        required: false
        type: string
        default: cyaris

permissions:
  contents: read

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatcher
        if: ${{ github.event_name == 'workflow_dispatch' && github.actor != inputs['allowed-dispatch-actor'] }}
        env:
          ALLOWED_DISPATCH_ACTOR: ${{ inputs['allowed-dispatch-actor'] }}
        run: |
          set -euo pipefail

          printf "Manual dispatch is restricted to %s.\n" "$ALLOWED_DISPATCH_ACTOR" >&2
          exit 1

      - name: Validate optional data preparation inputs
        env:
          DATA_CACHE_KEY: ${{ inputs.data-cache-key }}
          DATA_CACHE_PATH: ${{ inputs.data-cache-path }}
          PRE_TEST_PYTHON_SCRIPT: ${{ inputs.pre-test-python-script }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail

          if [[ -n "$DATA_CACHE_PATH" && -z "$DATA_CACHE_KEY" ]] || [[ -z "$DATA_CACHE_PATH" && -n "$DATA_CACHE_KEY" ]]; then
            printf "data-cache-path and data-cache-key must be supplied together.\n" >&2
            exit 1
          fi

          for relative_path in "$WORKING_DIRECTORY" "$DATA_CACHE_PATH" "$PRE_TEST_PYTHON_SCRIPT"; do
            if [[ -n "$relative_path" && ( "$relative_path" == /* || "$relative_path" == ".." || "$relative_path" == ../* || "$relative_path" == */../* || "$relative_path" == */.. ) ]]; then
              printf "Optional paths must stay within the configured working directory: %s\n" "$relative_path" >&2
              exit 1
            fi
          done

          if [[ -n "$PRE_TEST_PYTHON_SCRIPT" && "$PRE_TEST_PYTHON_SCRIPT" != *.py ]]; then
            printf "pre-test-python-script must name a Python file.\n" >&2
            exit 1
          fi

      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory == '.' && format('{0}/pyproject.toml', github.event.repository.name) || format('{0}/{1}/pyproject.toml', github.event.repository.name, inputs.working-directory) }}

      - name: Restore prepared test data
        if: inputs.data-cache-path != ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.event.repository.name }}/${{ inputs.working-directory }}/${{ inputs.data-cache-path }}
          key: ${{ runner.os }}-${{ github.event.repository.name }}-${{ inputs.data-cache-key }}

      - name: Install dependencies
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Check formatting with Black
        if: inputs.run-black
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: python -m black --check .

      - name: Check import ordering with isort
        if: inputs.run-isort
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: python -m isort --check-only .

      - name: Prepare test data
        if: inputs.pre-test-python-script != ''
        env:
          PRE_TEST_PYTHON_SCRIPT: ${{ inputs.pre-test-python-script }}
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: python "$PRE_TEST_PYTHON_SCRIPT"

      - name: Run tests
        if: inputs.run-pytest
        working-directory: ${{ github.event.repository.name }}/${{ inputs.working-directory }}
        run: python -m pytest
