name: Auto release

on:
  workflow_dispatch:
    inputs:
      release-sha:
        description: Commit SHA to reconcile releases through. Blank uses the default branch tip.
        required: false
        type: string
        default: ""
      pr-number:
        description: Pull request number to comment on.
        required: false
        type: string
        default: ""
      shared-automation-ref:
        description: shared-automation ref used to read the shared release policy.
        required: false
        type: string
        default: ""
      publish:
        description: Apply selected release creates and updates. Keep false to report the plan only.
        required: false
        type: boolean
        default: false
      update-existing:
        description: Update existing release titles and notes.
        required: false
        type: boolean
        default: true
      review-artifact-retention-days:
        description: Days to retain report-only review artifacts.
        required: false
        type: number
        default: 30

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-release:
    uses: ./.github/workflows/auto-release.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      pr-number: ${{ inputs.pr-number }}
      release-sha: ${{ inputs.release-sha }}
      shared-automation-ref: ${{ inputs.shared-automation-ref || vars.SHARED_AUTOMATION_REF || 'main' }}
      publish: ${{ inputs.publish }}
      update-existing: ${{ inputs.update-existing }}
      review-artifact-retention-days: ${{ inputs.review-artifact-retention-days }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
